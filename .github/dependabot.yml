# .github/dependabot.yml — automatic dependency updates for ClipBot
#
# Weekly scan of pip dependencies and GitHub Actions. Safe patch/minor updates
# are auto-merged by 00_auto_merge_deps.yml. Major bumps and fragile packages
# (ML/audio that bundle native binaries) require manual review.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Protect version-sensitive packages that carry native C++/binary
    # extensions (ctranslate2, opencv wheel ABI mismatches, etc.).
    # Dependabot still OPENs PRs for these, but 00_auto_merge_deps.yml will
    # post a "manual review required" comment instead of auto-merging.
    ignore:
      - dependency-name: "faster-whisper"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "opencv-python-headless"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "yt-dlp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"