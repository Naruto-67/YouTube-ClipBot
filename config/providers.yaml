# config/providers.yaml
# ─────────────────────────────────────────────────────────────
# All API limits live here. If Google/Groq changes their free
# tier, update the numbers here — no code changes needed.
# ─────────────────────────────────────────────────────────────

# ── Auto model discovery ────────────────────────────────────
# When enabled, the system queries Gemini's model list at
# startup and automatically adds newer free models (e.g.
# gemini-3.0-flash) at the top priority tier without code
# changes. Set to false to rely purely on the static list below.
auto_discovery:
  enabled: true
  max_stable_models: 6
  max_preview_models: 2
  discover_groq: true      # Also discover Groq text models dynamically

youtube:
  daily_units: 10000
  reset_timezone: "US/Pacific"   # YouTube quota resets at PT midnight

  # Cost of each operation in quota units
  unit_costs:
    channels_list: 1
    playlist_items_list: 1
    videos_list: 1
    videos_insert: 1600
    videos_update: 50
    playlist_items_insert: 50
    reports_query: 1              # YouTube Analytics
    videos_delete: 50             # Guardian: remove policy-violating shorts
    guardian_check: 1             # videos.list health check (per 50-video batch)

gemini:
  reset_timezone: "US/Pacific"   # Gemini quota resets at PT midnight
  models:
    # ── Current generation (Aug 2026) ────────────────────────
    - name: "gemini-3.7-flash"
      tier: 1                    # Newest flash — highest priority
      rpm: 10
      rpd: 250
      tpm: 250000
      stable: true

    - name: "gemini-3.6-flash"
      tier: 2
      rpm: 10
      rpd: 250
      tpm: 250000
      stable: true

    - name: "gemini-3.5-flash-lite"
      tier: 3                    # Fastest/cheapest, high RPD
      rpm: 15
      rpd: 1000
      tpm: 250000
      stable: true

    # ── Previous generation fallbacks ────────────────────────
    - name: "gemini-2.5-flash"
      tier: 4
      rpm: 10
      rpd: 250
      tpm: 250000
      stable: true

    - name: "gemini-2.5-flash-lite"
      tier: 5
      rpm: 15
      rpd: 1000
      tpm: 250000
      stable: true

    # ── Last resort only ─────────────────────────────────────
    - name: "gemini-2.5-pro"
      tier: 10
      rpm: 5
      rpd: 100
      tpm: 250000
      stable: false              # Kept for absolute emergency

groq:
  reset_timezone: "UTC"          # Groq quota resets at UTC midnight
  models:
    - name: "llama-3.3-70b-versatile"
      tier: 3
      rpm: 30
      rpd: 14400
      stable: true

    - name: "llama-3.1-8b-instant"
      tier: 4
      rpm: 30
      rpd: 14400
      stable: true
