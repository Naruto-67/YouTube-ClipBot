# config/pipeline.yaml
# All pipeline behavior is controlled here. Changes take effect on the next run.

# Volume
max_clips_per_day: 6
max_clips_per_week: 30
max_source_videos_per_creator: 3

# Source video constraints
max_video_age_days: 14
backlog_max_age_days: 60
max_video_length_minutes: 180
min_disk_free_gb: 3

# Clip bank
clip_bank_low_threshold: 12
clips_per_video_tiers:
  - max_minutes: 10
    clips: 2
  - max_minutes: 20
    clips: 4
  - max_minutes: 35
    clips: 6
  - max_minutes: 60
    clips: 8
  - max_minutes: 999
    clips: 12

# Manual queue
manual_queue_file: "config/manual_queue.yaml"

# Transcription waterfall: YouTube captions -> Groq Whisper -> local faster-whisper
prefer_captions: true
chunk_duration_minutes: 15
chunk_overlap_minutes: 2
groq_whisper_model: "whisper-large-v3"

# Segment download
transcript_buffer_seconds: 6

# Clip selection
min_clip_seconds: 30
max_clip_seconds: 60
ai_confidence_threshold: 0.60
ai_confidence_floor: 0.30
circuit_breaker_failures: 3

# Caption style
caption_words_per_line: 4
caption_font: "Anton-Regular"
caption_font_size: 85
caption_text_color: "&H00FFFFFF"
caption_highlight_color: "&H0000FFFF"
caption_outline_color: "&H00000000"
caption_glow: true
caption_glow_color: "&H0000D700"
caption_glow_size: 28
caption_glow_blur: 15

# Content ID mitigation - pitch shift source audio 2 semitones
# Inaudible to humans but defeats most Content ID fingerprint matching
content_id_pitch_shift: 2

# Background music - drop royalty-free MP3s into assets/music/
add_background_music: true
music_volume: 0.05
music_fade_in: 0.8
music_fade_out: 1.2

# Video rendering
output_width: 1080
output_height: 1920
output_fps: 30
output_crf: 23
original_audio_db: -20
apply_vignette: true
vignette_angle: 0.785

# Voiceover hook - first-3-second spoken hook dramatically increases watch time
add_voiceover_hook: true
hook_max_words: 10
hook_voice: "en-US-GuyNeural"
hook_tts_provider: "piper"
hook_piper_model: "en_US-amy-medium"
piper_bin: "piper"

# Upload safety - anti-spam and policy compliance
min_hours_between_uploads: 3
upload_jitter_minutes: 15
min_days_before_reclip_source: 7
max_title_similarity: 0.80

# Scheduling
upload_buffer_hours: 3
analytics_subscriber_threshold: 1000
default_upload_windows_utc:
  - "14:00"
  - "19:00"
  - "22:00"
  - "01:00"

# Video Guardian - post-upload health monitoring
run_video_guardian: true
video_health_check_hours: 48
video_guardian_lookback_days: 30
auto_remove_on_rejection: true
auto_remove_on_strike: true

# Trend research
run_trend_research: true
trend_research_region: "US"

# Channel scoring - dynamic video budget allocation
discovery_video_budget: 8

# Performance feedback loop
performance_feedback: true

# Storage cleanup
prune_processed_videos_days: 90
prune_quota_log_days: 30
prune_ai_reliability_days: 14
prune_failures_days: 14
prune_analytics_days: 60
prune_clip_bank_days: 30
error_log_max_mb: 1.0

# Retry behavior
max_render_retries: 3
max_upload_retries: 3
