# config/channels.yaml
# ─────────────────────────────────────────────────────────────
# YOUR UPLOAD CHANNEL (the channel you own and upload to)
# ─────────────────────────────────────────────────────────────
upload_channel:
  credentials_env: "YOUTUBE_CREDENTIALS"
  discord_webhook_env: "DISCORD_WEBHOOK"
  # YouTube video category ID applied to all uploads.
  # 22 = People & Blogs (default for clip channels). See:
  # https://developers.google.com/youtube/v3/docs/videos#snippet.categoryId
  category_id: "22"

# ─────────────────────────────────────────────────────────────
# SOURCE CREATORS (channels you clip from)
# Add or remove creators freely. Set active: false to pause one.
# ─────────────────────────────────────────────────────────────
source_creators:
  - name: "MrBeast"
    channel_id: "UCX6OQ3DkcsbYNE6H8uQQuVA"
    active: true
    max_videos_per_run: 2

  - name: "Mark Rober"
    channel_id: "UCY1kMZp36IQSyNx_9h4mpCg"
    active: true
    max_videos_per_run: 1

